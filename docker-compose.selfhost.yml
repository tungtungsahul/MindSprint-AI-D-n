version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mindsprint-selfhost-sql
    restart: unless-stopped
    env_file:
      - ./.env.selfhost
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required in .env.selfhost}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mindsprint_local_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend/MindSprint.Api
      dockerfile: Dockerfile
    image: mindsprint-selfhost-api:latest
    container_name: mindsprint-selfhost-api
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - ./.env.selfhost
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-SelfHost}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: ${ConnectionStrings__Default:?ConnectionStrings__Default is required in .env.selfhost}
      Jwt__Key: ${Jwt__Key:?Jwt__Key is required in .env.selfhost}
      Jwt__Issuer: ${Jwt__Issuer:-MindSprint-Local}
      Jwt__Audience: ${Jwt__Audience:-MindSprint-Local-Client}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:?Cors__AllowedOrigins is required in .env.selfhost}
      Gemini__ApiKey: ${Gemini__ApiKey:-}
      Google__ClientId: ${Google__ClientId:-}
    ports:
      - "127.0.0.1:5000:8080"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: mindsprint-selfhost-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mindsprint_local_mssqldata:
