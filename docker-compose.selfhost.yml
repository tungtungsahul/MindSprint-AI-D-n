version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindsprint-selfhost-db
    restart: unless-stopped
    env_file:
      - ./.env.selfhost
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.selfhost}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.selfhost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.selfhost}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mindsprint_local_pgdata:${PGDATA:-/var/lib/postgresql/data/pgdata}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ./backend/MindSprint.Api
      dockerfile: Dockerfile
    image: mindsprint-selfhost-api:latest
    container_name: mindsprint-selfhost-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.selfhost
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-SelfHost}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: ${ConnectionStrings__Default:?ConnectionStrings__Default is required in .env.selfhost}
      Jwt__Key: ${Jwt__Key:?Jwt__Key is required in .env.selfhost}
      Jwt__Issuer: ${Jwt__Issuer:-MindSprint-Local}
      Jwt__Audience: ${Jwt__Audience:-MindSprint-Local-Client}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:?Cors__AllowedOrigins is required in .env.selfhost}
      Gemini__ApiKey: ${Gemini__ApiKey:-}
      Google__ClientId: ${Google__ClientId:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: mindsprint-selfhost-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mindsprint_local_pgdata:
